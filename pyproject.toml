[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-htr"
version = "0.1.0"
description = "Reproducible recognition and error analysis for historical ledger images"
requires-python = ">=3.12"
dependencies = ["Pillow>=11,<12"]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.48,<5", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]
dev = ["pytest>=8,<9", "matplotlib>=3.9,<4"]

[project.scripts]
ledger-htr = "ledger_htr.cli:main"

[tool.setuptools.packages.find]
include = ["ledger_htr*"]

[tool.setuptools.package-data]
ledger_htr = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
